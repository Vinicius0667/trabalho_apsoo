services:
  db:
    image: postgres:16-alpine
    container_name: agenda-db
    environment:
      POSTGRES_DB: agenda
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U root -d agenda"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  app:
    build: .
    container_name: agenda-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:postgresql://db:5432/agenda
      - DB_USER=root
      - DB_PASSWORD=root
      - TZ=America/Campo_Grande
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.Xauthority
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-~/.Xauthority}:/tmp/.Xauthority:ro
    security_opt:
      - label=disable
    userns_mode: "keep-id"
    user: "${UID}:${GID}" 
    restart: unless-stopped
